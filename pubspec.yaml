name: chat_app
description: "Fullstack Chat Application monorepo root"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"

workspace:
  - packages/component_library
  - packages/domain_models
  - packages/key_value_storage
  - packages/repositories/auth_repository
  - packages/repositories/chat_repository
  - packages/repositories/localization_repository
  - packages/repositories/user_repository
  - packages/web_component_library
  - packages/features/auth
  - packages/features/conversation_list
  - packages/features/chat_room
  - packages/features/user_profile
  - packages/features/settings
  - packages/features/contact_picker
  - server/chat_server
  - server/chat_client
  - apps/chat_flutter

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.5.0
