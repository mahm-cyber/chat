class: AppUser
table: app_user
fields:
  firebaseUid: String
  phoneNumber: String
  displayName: String
  bio: String?
  photoUrl: String?
  notificationsEnabled: bool
  lastSeenAt: DateTime?
  createdAt: DateTime
indexes:
  app_user_phone_idx:
    fields: phoneNumber
    unique: true
  app_user_uid_idx:
    fields: firebaseUid
    unique: true
