services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: chat
      POSTGRES_PASSWORD: "atCrIePQbD-ybZPiwEdRnF6UvGqvV6JI"
    volumes:
      - chat_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "GV9-gxbqeEeLH8kSAfUtUgWRHxmWZmIM"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: chat_test
      POSTGRES_PASSWORD: "JZn0yS59kzHTLYM_m6g1wPDKbPUaOyPI"
    volumes:
      - chat_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "81RsK5cYW69T6MOvhBrIOXFZEb8l2jnn"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  chat_data:
  chat_test_data:
